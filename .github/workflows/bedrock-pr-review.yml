name: Bedrock PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Bedrock review
        id: bedrock-review
        uses: ./. # replace with owner/repo@ref once published
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }} # optional
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          bedrock-region: ap-northeast-2
          bedrock-model-id: apac.anthropic.claude-3-sonnet-20240229-v1:0
          review-instructions: |
            - Prioritize correctness issues and missing test coverage
            - Highlight any obvious performance regressions

      - name: Comment review on PR
        if: steps.bedrock-review.outputs.review != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.bedrock-review.outputs.review }}
