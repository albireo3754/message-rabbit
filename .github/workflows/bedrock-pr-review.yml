name: PR Review with Bedrock

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/<bedrock-invoke-role>
          aws-region: ap-northeast-2

      - name: Generate Bedrock review
        id: bedrock-review
        uses: ./. # replace with owner/repo@ref once published
        with:
          bedrock-region: ap-northeast-2
          bedrock-model-id: anthropic.claude-3-sonnet-20240229-v1:0
          review-instructions: |
            - Prioritize correctness issues and missing test coverage
            - Highlight any obvious performance regressions

      - name: Comment review on PR
        if: steps.bedrock-review.outputs.review != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.bedrock-review.outputs.review }}
